name: Publish JD Sports mobile support

on:
  push:
    branches:
      - agent/cloudflare-production

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-production
      - name: Apply tested patch
        run: |
          printf '%s' '' | base64 -d > /tmp/jd-mobile.tgz
          tar -xzf /tmp/jd-mobile.tgz
          rm -f .github/workflows/publish-jd-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/collector/src/connectors/index.ts services/collector/tests/connector-hardening.test.ts .github/workflows/publish-jd-mobile.yml
          git commit -m "fix: allow JD Sports mobile storefront"
          git push origin HEAD:agent/cloudflare-production
