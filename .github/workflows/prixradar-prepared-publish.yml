name: Publish prepared PrixRadar update
on:
  push:
    branches:
      - agent/cloudflare-production
    paths:
      - .github/workflows/prixradar-prepared-publish.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == 'madouyatt95'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-production
          fetch-depth: 0
      - name: Apply tested PrixRadar files
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | tar -xz
          rm .github/workflows/prixradar-prepared-publish.yml
          git config user.name "codex"
          git config user.email "267193182+codex@users.noreply.github.com"
          git add -A
          git commit -m "feat: focus Amazon France and add JD Sports"
          git push origin HEAD:agent/cloudflare-production
