name: Clean PrixRadar publication metadata
on:
  push:
    branches:
      - agent/cloudflare-production
    paths:
      - .github/workflows/prixradar-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor == 'madouyatt95'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-production
          fetch-depth: 0
      - name: Remove macOS archive metadata
        shell: bash
        run: |
          find . -type f -name '._*' -delete
          rm .github/workflows/prixradar-cleanup.yml
          git config user.name "codex"
          git config user.email "267193182+codex@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove archive metadata"
          git push origin HEAD:agent/cloudflare-production
