name: Apply Amazon France defaults

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cloudflare-production

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-production
      - name: Apply tested patch
        run: |
          printf '%s' '' | base64 -d > /tmp/prixradar-patch.tgz
          tar -xzf /tmp/prixradar-patch.tgz
          rm -f .github/workflows/apply-fr-jd-defaults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/ean/route.ts app/components/price-radar-app.tsx services/collector/src/actor.ts services/collector/.actor/input_schema.json .github/workflows/apply-fr-jd-defaults.yml
          git commit -m "fix: align Amazon France automation defaults"
          git push origin HEAD:agent/cloudflare-production
